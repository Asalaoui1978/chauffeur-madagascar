name: Vérification du build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Contrôle SEO (hreflang et sitemap)
        run: |
          grep -o '<link rel="alternate"[^>]*>' dist/it/index.html
          grep -c "<loc>" dist/sitemap-0.xml
