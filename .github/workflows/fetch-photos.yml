name: Rapatrier les photos Wikimedia
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y imagemagick >/dev/null
      - run: node scripts/fetch-wikimedia.mjs
      - run: du -sh public/images/wm && ls -la public/images/wm | head -80
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images/wm src/data/wm-local.json
          git diff --cached --quiet || git commit -m "Photos Wikimedia hébergées sur le site"
          git push
